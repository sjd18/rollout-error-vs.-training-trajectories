[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rollscale"
version = "0.1.0"
description = "Rollout error of a learned Equinox MLP potential vs. number of training trajectories and model width."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "eqxmlp @ git+https://github.com/sjd18/Equinox-MLP.git",
    "jax>=0.4.30",
    "equinox>=0.11.4",
    "numpy",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
notebook = ["jupyter"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rollscale"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
